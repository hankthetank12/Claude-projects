name: Watch auctions tests

on:
  push:
    paths:
      - "watch-auctions/**"
      - ".github/workflows/watch-auctions-ci.yml"
  pull_request:
    paths:
      - "watch-auctions/**"
      - ".github/workflows/watch-auctions-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q
        working-directory: watch-auctions

      - name: Check the demo build works end to end
        run: python -m watch_auctions demo
        working-directory: watch-auctions/src
