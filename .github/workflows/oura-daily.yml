name: Oura morning brief

# Sends the brief every morning. The schedule is UTC: 11:00 UTC is 07:00
# US Eastern in summer (EDT) and 06:00 in winter (EST) — adjust to taste.
# GitHub's scheduler can lag a scheduled run by several minutes under load.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      skip_send:
        description: "Sync and build only, do not send the email"
        type: boolean
        default: false
      days:
        description: "How many days of history to fetch"
        type: string
        default: "120"

permissions:
  contents: write

concurrency:
  group: oura-daily
  cancel-in-progress: false

defaults:
  run:
    working-directory: oura-dashboard

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the dashboard URL
        id: pages
        run: |
          echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"

      # One step for the whole job: Oura refresh tokens are single use, so the
      # replacement has to be written back to the OURA_REFRESH_TOKEN secret
      # within the same process that spent the old one. If that write fails the
      # brief still goes out, carrying a notice, and the run exits non-zero.
      - name: Sync, rebuild and send the morning brief
        id: morning
        # Kept non-fatal here so the history commit and the dashboard upload
        # below still happen; the final step re-fails the job.
        continue-on-error: true
        env:
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          OURA_REFRESH_TOKEN: ${{ secrets.OURA_REFRESH_TOKEN }}
          OURA_TOKEN: ${{ secrets.OURA_TOKEN }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OURA_SLEEP_NEED_HOURS: ${{ vars.OURA_SLEEP_NEED_HOURS }}
          # Needs "Secrets: write" on this repository; the default
          # GITHUB_TOKEN cannot update Actions secrets.
          GH_TOKEN: ${{ secrets.OURA_SECRETS_PAT }}
        run: |
          python -m oura_dashboard --verbose morning \
            --days "${{ inputs.days || '120' }}" \
            --url "${{ steps.pages.outputs.url }}" \
            --attach-dashboard \
            ${{ inputs.skip_send == true && '--skip-send' || '' }}
        working-directory: oura-dashboard/src
        # src/ is on the path so the package imports without installing.

      - name: Commit the updated history
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -z "$(git status --porcelain oura-dashboard/data)" ]; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oura-dashboard/data
          git commit -m "Update Oura history for $(date -u +%Y-%m-%d)"
          # Another run (or a push) may have landed first; rebase and retry.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed, rebasing and retrying ($attempt/3)."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep $((attempt * 4))
          done
          echo "Could not push the history update." >&2
          exit 1

      - name: Upload the dashboard for publishing
        if: always() && hashFiles('oura-dashboard/out/index.html') != ''
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: oura-dashboard/out

      # Surface the real outcome now that the durable work is done. A red run
      # here almost always means the rotated refresh token could not be saved,
      # and the emailed brief says exactly what to fix.
      - name: Fail if the brief did not complete
        if: steps.morning.outcome == 'failure'
        run: |
          echo "::error::The morning job reported a problem — check the brief for details." >&2
          exit 1


  # Publishing is best-effort: if Pages is not enabled for the repository this
  # job fails on its own without costing you the morning email.
  publish:
    needs: brief
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
