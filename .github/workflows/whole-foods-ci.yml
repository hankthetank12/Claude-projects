name: Whole Foods agent tests

on:
  push:
    paths:
      - "whole-foods-agent/**"
      - ".github/workflows/whole-foods-ci.yml"
  pull_request:
    paths:
      - "whole-foods-agent/**"
      - ".github/workflows/whole-foods-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest -q
        working-directory: whole-foods-agent

      - name: Check the demo build works end to end
        run: python -m whole_foods_agent demo --days 120
        working-directory: whole-foods-agent/src
