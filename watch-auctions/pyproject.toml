[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-auctions"
version = "0.1.0"
description = "Aggregates upcoming watch lots from small US auction houses into one scrolling catalog."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
watch-auctions = "watch_auctions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The house-site registry ships with the package.
[tool.setuptools.package-data]
watch_auctions = ["houses.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
