[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oura-dashboard"
version = "1.0.0"
description = "Tracks Oura ring stats, builds an HTML dashboard, and emails a morning suggestions brief."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
oura-dashboard = "oura_dashboard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The dashboard's CSS and JS are read at render time, so they must ship
# with the package rather than only existing in the source tree.
[tool.setuptools.package-data]
oura_dashboard = ["assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
