[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whole-foods-agent"
version = "1.0.0"
description = "Builds your next Whole Foods order from your own buying history."
requires-python = ">=3.10"
dependencies = []

# Only the browser cart back end needs Playwright, and most installs will not
# use it, so it stays an opt-in extra: pip install -e ".[browser]"
[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.scripts]
whole-foods = "whole_foods_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The order sheet's CSS and JS are read at render time, so they must ship with
# the package rather than only existing in the source tree.
[tool.setuptools.package-data]
whole_foods_agent = ["assets/*.css", "assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
